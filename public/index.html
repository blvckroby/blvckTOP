<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#08090b" />
  <title>blvckTOP · Top 10 per Nuvio e Stremio</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #08090b;
      --line: rgba(255,255,255,.08);
      --line2: rgba(255,255,255,.16);
      --text: #f4f5f7;
      --muted: #8b919d;
      --dim: #5d636e;
      --good: #6fd69a;
      --bad: #ff7b7b;
      --ease: cubic-bezier(.22,1,.36,1);
      --h: 40px;
      --serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
    }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; -webkit-text-size-adjust: 100%; overflow-x: hidden; }
    body {
      margin: 0; min-height: 100vh; color: var(--text); overflow-x: hidden;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px; -webkit-font-smoothing: antialiased;
      background: radial-gradient(900px 480px at 50% -120px, rgba(255,255,255,.07), transparent 70%), var(--bg);
    }
    .page { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 96px; }
    button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
    button:disabled { opacity: .5; cursor: wait; }

    /* ---------- hero ---------- */
    .hero { text-align: center; padding: 20px 0 52px; }
    .eyebrow { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    h1 { margin: 22px 0 22px; font-family: var(--serif); font-weight: 400; font-size: clamp(54px, 11vw, 112px); line-height: .92; letter-spacing: -.035em; }
    h1 em { font-style: italic; color: #fff; }
    h1 span { color: #a3a8b3; }
    .lede { max-width: 520px; margin: 0 auto; color: var(--muted); font-size: 17px; line-height: 1.65; }
    .cta { display: flex; justify-content: center; align-items: center; gap: 26px; margin-top: 34px; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 10px; height: 46px; padding: 0 24px; border-radius: 999px; background: #f4f5f7; color: #0a0b0d; font-weight: 600; font-size: 14px; text-decoration: none; transition: transform .3s var(--ease), background .2s; }
    .btn:hover { background: #fff; transform: translateY(-1px); }
    .btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .link { color: var(--muted); font-size: 14px; text-decoration: none; border-bottom: 1px solid var(--line2); padding-bottom: 2px; transition: color .2s, border-color .2s; }
    .link:hover { color: #fff; border-color: #fff; }
    .targets { display: flex; justify-content: center; align-items: center; gap: 28px; margin-top: 44px; flex-wrap: wrap; color: var(--dim); font-size: 12px; letter-spacing: .04em; }
    .targets span { display: inline-flex; align-items: center; gap: 8px; }
    .targets img { height: 16px; width: auto; max-width: 84px; object-fit: contain; opacity: .8; }
    .targets img.wm { filter: brightness(0) invert(1); opacity: .65; }

    .band { position: relative; overflow: hidden; margin: 0 0 56px; padding: 22px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      -webkit-mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); mask-image: linear-gradient(90deg, transparent, #000 14%, #000 86%, transparent); }
    .track { display: flex; align-items: center; gap: 64px; width: max-content; animation: scroll 60s linear infinite; }
    @keyframes scroll { to { transform: translateX(-50%); } }
    .brand { display: flex; align-items: center; height: 24px; }
    .brand img { height: 22px; width: auto; max-width: 100px; filter: brightness(0) invert(1); opacity: .42; }

    .covers { display: flex; justify-content: center; gap: 18px; margin: 0 0 80px; }
    .cv { flex: 0 1 200px; min-width: 0; }
    .poster { display: block; aspect-ratio: 16/9; border-radius: 10px; overflow: hidden; background: rgba(255,255,255,.03); border: 1px solid var(--line); transition: transform .4s var(--ease); }
    .cv:hover .poster { transform: translateY(-4px); }
    .poster img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* ---------- sezioni ---------- */
    .step { padding: 44px 0; border-top: 1px solid var(--line); }
    .step-head { display: flex; align-items: baseline; gap: 18px; margin-bottom: 26px; }
    .step-n { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--dim); letter-spacing: .08em; }
    h2 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 4vw, 36px); letter-spacing: -.02em; }
    .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    /* controlli condivisi: stessa altezza, stesso stile */
    .ctl { height: var(--h); border-radius: 999px; border: 1px solid var(--line2); background: transparent; color: #d7dbe2; font-size: 13px; font-weight: 500; transition: background .2s, border-color .2s, color .2s; }
    button.ctl { display: inline-flex; align-items: center; justify-content: center; padding: 0 18px; }
    button.ctl:hover { background: rgba(255,255,255,.06); color: #fff; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .search { flex: 1 1 220px; min-width: 0; width: auto; padding: 0 18px; outline: none; font: inherit; font-size: 13px; color: #fff; }
    .search::placeholder { color: var(--dim); }
    .search:focus { border-color: rgba(255,255,255,.4); }
    .seg { display: inline-flex; padding: 3px; gap: 2px; }
    .seg button { padding: 0 14px; border-radius: 999px; color: var(--muted); font-size: 13px; font-weight: 500; transition: .2s; }
    .seg button.on { background: rgba(255,255,255,.12); color: #fff; }
    .counter { margin-left: auto; color: var(--dim); font-size: 13px; padding-left: 6px; }
    .counter b { color: #fff; font-weight: 600; }

    .bulk { display: flex; flex-wrap: wrap; gap: 6px 22px; align-items: center; margin: 0 0 18px; color: var(--dim); font-size: 12px; }
    .bulk .grp { display: inline-flex; align-items: center; gap: 4px; }
    .bulk .grp > em { font-style: normal; margin-right: 6px; letter-spacing: .08em; text-transform: uppercase; font-size: 10.5px; }

    /* opzioni minimal: formato / sfondo */
    .o { display: inline-flex; align-items: center; gap: 8px; height: 28px; padding: 0 11px; border-radius: 999px; border: 1px solid transparent; color: var(--muted); font-size: 12.5px; transition: .2s; white-space: nowrap; }
    .o:hover { color: #fff; }
    .o.on { color: #fff; border-color: var(--line2); background: rgba(255,255,255,.05); }
    .g-land, .g-port { display: block; border: 1.25px solid currentColor; border-radius: 2px; }
    .g-land { width: 16px; height: 9px; }
